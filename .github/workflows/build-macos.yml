name: Build macOS

on:
  workflow_dispatch: # Manual trigger — click "Run workflow" on GitHub
  push:
    tags:
      - 'v*' # Also builds automatically when a version tag is pushed

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write # needed to create the draft release on a tag push
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      # Unsigned build. To sign + notarize for public distribution, add the
      # repo secrets below and uncomment the env block — full walkthrough in
      # documentation/distribution/APPLE_SIGNING_SETUP.md:
      #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD
      #   APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
      # On a version-tag push this also creates a DRAFT pre-release with the
      # .dmg attached, so testers get a stable download link once Gao publishes
      # it. Manual runs still only upload the artifact below.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('DustOff Reset {0}', github.ref_name) || '' }}
          releaseBody: 'Unsigned macOS build (Apple Silicon). First open: System Settings > Privacy & Security > Open Anyway.'
          releaseDraft: true
          prerelease: true

      - name: Upload artifact (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: dustoff-reset-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
