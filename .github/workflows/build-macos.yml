name: Build macOS

on:
  workflow_dispatch: # Manual trigger — click "Run workflow" on GitHub
  push:
    tags:
      - 'v*' # Also builds automatically when a version tag is pushed

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write # needed to create the draft release on a tag push
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      # Two build steps, one of which runs. If the six Apple secrets are set
      # (documentation/distribution/APPLE_SIGNING_SETUP.md), the app is signed
      # with the Developer ID certificate and notarized by Apple, so a stranger's
      # first open is clean. If they are not set, the unsigned build runs, as
      # before. On a version-tag push either step also attaches the .dmg to a
      # draft pre-release, which Gao publishes after a look.
      # The secrets context is not readable in a step's `if`, so a one-line
      # step turns "is the certificate secret set?" into an output.
      - name: Decide signed or unsigned
        id: signing
        run: echo "enabled=${{ secrets.APPLE_CERTIFICATE != '' }}" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app (signed and notarized)
        if: steps.signing.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('DustOff Reset {0}', github.ref_name) || '' }}
          releaseBody: 'macOS, Apple Silicon. Signed and notarized. Nothing leaves your Mac: no account, no server.'
          releaseDraft: true
          prerelease: true

      - name: Build Tauri app (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('DustOff Reset {0}', github.ref_name) || '' }}
          releaseBody: 'Unsigned early build for macOS on Apple Silicon. First open: System Settings > Privacy & Security > Open Anyway. Nothing leaves your Mac: no account, no server.'
          releaseDraft: true
          prerelease: true

      - name: Upload artifact (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: dustoff-reset-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
