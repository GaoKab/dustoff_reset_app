name: Build Windows

on:
  workflow_dispatch: # Manual trigger — pick the branch in the "Run workflow" dialog

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      # Unsigned for now: tauri.conf.json has no certificateThumbprint, so the
      # first run shows SmartScreen's "Windows protected your PC" (More info,
      # then Run anyway). Signing (Azure Trusted Signing or an OV certificate)
      # comes after the organisation account exists; see
      # fable-build/collateral/17_Windows_Readiness_2026-10-03.md.
      # Version tags are built and published by release.yml; this workflow is
      # the manual artifact-only build.
      - name: Build Tauri app (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (.msi and .exe)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-reset-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
