name: Build Windows

on:
  workflow_dispatch: # Manual trigger — pick the branch in the "Run workflow" dialog
  push:
    tags:
      - 'v*' # On a version tag, builds the installer and attaches it to the same draft release as the macOS job

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # needed to attach the .msi to the draft release on a tag push
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      # Unsigned for now: tauri.conf.json has no certificateThumbprint, so the
      # first run shows SmartScreen's "Windows protected your PC" (More info,
      # then Run anyway). Signing (Azure Trusted Signing or an OV certificate)
      # comes after the organisation account exists; see
      # fable-build/collateral/17_Windows_Readiness_2026-10-03.md.
      # On a version-tag push, tauri-action attaches the .msi to the draft
      # pre-release the macOS job creates for the same tag (same tagName and
      # releaseName, so it reuses the release rather than making a second one).
      - name: Build Tauri app (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('DustOff Reset {0}', github.ref_name) || '' }}
          releaseBody: 'Windows: unsigned test build, untested beyond CI. First run: More info, then Run anyway. Browser-tab detection and the calendar nudge are macOS only in this version. Nothing leaves your machine: no account, no server.'
          releaseDraft: true
          prerelease: true

      - name: Upload artifact (.msi and .exe)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-reset-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
